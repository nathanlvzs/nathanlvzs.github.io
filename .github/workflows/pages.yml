name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v6
        with:
          path: site

      - name: Check invest_learn token
        env:
          INVEST_LEARN_READ_TOKEN: ${{ secrets.INVEST_LEARN_READ_TOKEN }}
        run: |
          if [ -z "$INVEST_LEARN_READ_TOKEN" ]; then
            echo "::error::Missing Actions secret INVEST_LEARN_READ_TOKEN. Create a fine-grained PAT with read-only Contents access to NathanLvzs/invest_learn."
            exit 1
          fi

      - name: Checkout invest_learn
        uses: actions/checkout@v6
        with:
          repository: NathanLvzs/invest_learn
          token: ${{ secrets.INVEST_LEARN_READ_TOKEN }}
          path: invest_learn

      - name: Validate invest_learn content
        working-directory: invest_learn
        run: ruby scripts/validate_content_structure.rb

      - name: Export invest_learn site
        working-directory: invest_learn
        run: ruby scripts/export_jekyll_site.rb --output ../site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./site/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
